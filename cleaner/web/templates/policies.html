{% extends "base.html" %}
{% block title %}Политики — Cleaner{% endblock %}
{% block main %}
<p><a href="/settings">← Настройки</a></p>
<h1>Политики типов</h1>
<form method="post" action="/settings/policies">
  {% include "_csrf.html" %}
  <table>
    <tr><th>Тип</th><th>Политика</th></tr>
    {% for code, name in types.items() %}
    <tr>
      <td>{{ name }}</td>
      <td><select name="policy-{{ code.value }}">
        {% for policy, label in names.items() %}<option value="{{ policy.value }}"{% if current[code] == policy %} selected{% endif %}>{{ label }}</option>{% endfor %}
      </select></td>
    </tr>
    {% endfor %}
  </table>
  <button>Сохранить</button>
</form>
{% endblock %}
