<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Cleaner{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body>
{% if viewer %}
<header class="top">
  <a href="/chats">Чаты</a>
  {% if viewer.is_admin %}<a href="/settings">Настройки</a>{% endif %}
  <span class="who">{{ viewer.user.login }}</span>
  <form method="post" action="/logout">{% include "_csrf.html" %}<button>Выйти</button></form>
</header>
{% endif %}
<main>{% block main %}{% endblock %}</main>
</body>
</html>
