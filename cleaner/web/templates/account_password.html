{% extends "base.html" %}
{% block title %}Смена пароля — Cleaner{% endblock %}
{% block main %}
<h1>Смена пароля</h1>
<p class="lead">После смены закрываются все ваши сессии, и эта тоже: войдите с новым паролем. <a href="/account/sessions">Мои сессии</a></p>
<section class="panel">
  <div class="panel-body">
    <form method="post" action="/account/password" class="form">
      {% if error %}<p class="flash bad">{{ error }}</p>{% endif %}
      {% include "_csrf.html" %}
      <input hidden autocomplete="username" value="{{ viewer.user.login }}">
      <label class="field"><span>Текущий пароль</span><input name="current" type="password" autocomplete="current-password" required></label>
      <label class="field"><span>Новый пароль</span><span class="control">
        <input name="password" type="password" minlength="{{ min_password }}" autocomplete="new-password" required>
        <small class="hint">Не короче {{ min_password }} знаков</small>
      </span></label>
      <label class="field"><span>Повтор</span><input name="repeat" type="password" minlength="{{ min_password }}" autocomplete="new-password" required></label>
      <div class="buttons"><button class="primary">Сменить пароль</button></div>
    </form>
  </div>
</section>
{% endblock %}
