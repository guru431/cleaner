# Шаблон настроек Cleaner. Установщик подставляет адрес из локального профиля хоста
# и дальше его не трогает: правка на сервере переживает обновление.

[server]
host = "127.0.0.1"   # внешний интерфейс требует TLS и явного профиля хоста (SEC-8)
port = 5464
tls_cert = "/etc/cleaner/tls/cert.pem"
tls_key = "/etc/cleaner/tls/key.pem"

[paths]
data_dir = "/var/lib/cleaner"
models_dir = "/opt/cleaner/models"     # модели слоя 4 и Docling: пишет только models download

[limits]
max_text_chars = 500000
max_file_mb = 50

[ui]
utc_offset_hours = 3
