# Safe loopback example. Copy to <hostname -s>.conf and set the host's own networks.
# Real host profiles are local files excluded from Git; add them to the deployment stage separately.
HOST_IP=127.0.0.1
CLIENTS="127.0.0.0/8"
INTERNAL="127.0.0.0/8"
GATEWAY=127.0.0.1:30000
CERT_NAME=cleaner-example
SERVER_GUARD=0
GATEWAY_KEY_HINT="create a dedicated key in your local gateway"
