[pytest]
testpaths = tests
pythonpath = .
# Fail on worker loss: loadfile restart recovery can leave the controller and new workers waiting forever.
addopts = -m "not integration and not manual" -ra -n 2 --dist=loadfile --max-worker-restart=0
markers =
    integration: needs models, documents, a local LLM, the network, or more than a second
    manual: run by hand only
timeout = 30
# keep tmp_path dirs only of failed tests: three default runs in pytest-of-<user> filled drive C: (2026-10-21)
tmp_path_retention_policy = failed
